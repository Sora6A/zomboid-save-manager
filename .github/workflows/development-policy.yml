name: Development policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Development policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate every new commit and its bugfix evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_development_policy.py --base "$BASE_SHA" --head "$HEAD_SHA"
